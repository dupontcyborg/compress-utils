name: Fuzz

# Coverage-guided fuzzing of the decoders (tests/fuzz/). PRs get a short run
# starting from the corpus the nightly run has grown; the nightly run fuzzes
# longer (30 min, or 3 h on Sundays), minimizes the grown corpus and saves it
# back to the cache. PRs only read the cache, so they never overwrite main's
# corpus. The Sunday run shares the nightly's concurrency group, so a manual
# dispatch on main while it runs would cancel it.

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 7 * * 1-6"
    - cron: "0 7 * * 0"
  workflow_dispatch:

# Least-privilege default for all jobs; jobs needing more override below.
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Sunday's 3 h decoder run, the encoder run (a sixth of it, 30 min) and
    # ~5 min of build, merge and coverage: 215 min, with margin.
    timeout-minutes: ${{ github.event.schedule == '0 7 * * 0' && 240 || 60 }}
    env:
      FUZZ_SECONDS: >-
        ${{ github.event_name == 'pull_request' && '180'
        || github.event.schedule == '0 7 * * 0' && '10800'
        || '1800' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install clang + libFuzzer
        # llvm-18 provides llvm-symbolizer, which turns sanitizer reports into
        # function names and line numbers; the runtimes find it on PATH.
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev llvm-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Configure (every target instrumented for coverage + ASan/UBSan)
        run: >
          cmake -S . -B build-fuzz -DENABLE_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_PYTHON_BINDINGS=OFF
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build
        run: cmake --build build-fuzz -j 4

      - name: Generate seed corpus
        run: cmake --build build-fuzz --target fuzz_seeds

      - name: Replay regression inputs
        # Only the fuzz replay: the rest of the suite expects checksum errors,
        # which FUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION turns off.
        run: ctest --test-dir build-fuzz --output-on-failure -R "fuzz_(roundtrip_)?regressions"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        # New inputs go to the first directory (fuzz-corpus). Fork mode ignores
        # timeouts and OOMs by default; -ignore_*=0 makes a hang (the
        # decompression-bomb class) or a memory blowup fail the job. lsan.supp
        # silences a leak in libFuzzer's own fork-mode parent.
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/fuzz/lsan.supp
        run: |
          mkdir -p fuzz-corpus fuzz-artifacts
          ./build-fuzz/tests/fuzz/fuzz_decompress fuzz-corpus build-fuzz/tests/fuzz/seeds \
            -fork=$(nproc) -ignore_timeouts=0 -ignore_ooms=0 \
            -max_total_time=$FUZZ_SECONDS -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1

      - name: Fuzz round trip (encoders)
        # Random bytes must compress and decompress back, one-shot and
        # streaming. A sixth of the decoder budget, no cached corpus: the
        # decoder seeds are enough data to start from.
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/fuzz/lsan.supp
        run: |
          mkdir -p fuzz-corpus-rt fuzz-artifacts
          ./build-fuzz/tests/fuzz/fuzz_roundtrip fuzz-corpus-rt build-fuzz/tests/fuzz/seeds \
            tests/fuzz/regressions-roundtrip \
            -fork=$(nproc) -ignore_timeouts=0 -ignore_ooms=0 \
            -max_total_time=$((FUZZ_SECONDS / 6)) -max_len=65536 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

      - name: Minimize corpus
        if: github.event_name != 'pull_request' && !cancelled() && hashFiles('fuzz-corpus/**') != ''
        run: |
          mkdir fuzz-corpus-min
          ./build-fuzz/tests/fuzz/fuzz_decompress -merge=1 fuzz-corpus-min fuzz-corpus
          rm -rf fuzz-corpus && mv fuzz-corpus-min fuzz-corpus

      - name: Save fuzz corpus
        if: github.event_name != 'pull_request' && !cancelled() && hashFiles('fuzz-corpus/**') != ''
        uses: actions/cache/save@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}

      # Nightly: which code the corpus reaches, by replaying it through a
      # coverage build of the harness (fuzz_replay, no sanitizers). Shows the
      # decoder paths the fuzzer never gets to, i.e. where seeds or the harness
      # need work. Skipped when the run found a crash.
      - name: Build for corpus coverage
        if: github.event_name != 'pull_request' && success()
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_CPP_BINDINGS=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            "-DCMAKE_C_FLAGS=-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate
          cmake --build build-cov -j 4 --target fuzz_replay

      - name: Corpus coverage
        if: github.event_name != 'pull_request' && success()
        run: |
          python3 tools/coverage.py --build-dir build-cov --out-dir fuzz-coverage \
            --groups fuzz --fuzz-dirs fuzz-corpus build-fuzz/tests/fuzz/seeds
          cat fuzz-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus coverage report
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage
          path: |
            fuzz-coverage/fuzz-html/
            fuzz-coverage/fuzz.txt
